name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      # Never connected to; schema.prisma's env("DATABASE_URL") just has
      # to resolve or `prisma validate` fails with P1012.
      DATABASE_URL: file:./ci.sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Validates prisma/schema.prisma and generates the Prisma Client's
      # types — neither step needs a reachable database (DATABASE_URL
      # above only has to be set, not reachable). This is exactly
      # the check that would have caught the SQLite-doesn't-support-enums
      # bug before it ever reached a PR.
      - run: npx prisma validate
      - run: npx prisma generate

      - run: npx tsc --noEmit
